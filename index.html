<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <main>
        <div id="startOverlay" tabindex="0" aria-label="Tryk på skærmen for at starte">
            
            <div class="startbox">
                <h1 class="starttext">Tryg på skærmen for at starte</h1>
                <svg class="fa-solid fa-arrow-down"></svg>
            </div>
        </div>
        <section class="video.container">
            <video id="video" autoplay muted loop><source src="img/aqua.mp4" type="video/mp4"></video>
        </section>
        <section class="fishcontent">
            
            <img src="img/Gloria.svg" class="fish-image" id="Gloria">
            <img src="img/Goofy-ahh-ostefisk.svg" class="fish-image" id="Hilmer">
            <img src="img/John.svg" class="fish-image" id="John">
            <img src="img/Klovnejohn.svg" class="fish-image" id="Nemo">
            <img src="img/Lars-Hjortshaj.svg" class="fish-image" id="Lars-Hjortshaj">
            <img src="img/Lilla-fisk.svg" class="fish-image" id="Allan">
            <img src="img/Sandmissen.svg" class="fish-image" id="Knud">
            <img src="img/Søstjerne.png" class="fish-image" id="Stella">
            <img src="img/Tunbob.svg" class="fish-image" id="Martin"> 
            <img src="img/Lwk-den-bedste-fisk.svg" class="fish-image" id="Rasmus">
        </section>
        <section class="infofish">
            <button id="Elmerbtn"><img src="img/Elmer.svg" class="fish-image" id="Elmer"></button>
            <div id="modalElmer" class="modal">
                <div class="modal-content">
                    <span class="closebtn">&times;</span>
                    <h2>Elektrisk ål</h2>
                    <p>Den elektriske ål lever i ferskvand og kan findes i amazonas</p>
                    <img src="elaal">
                </div>
            </div>
        
          <button id="Hilmerbtn"><img src="img/Goofy-ahh-ostefisk.svg" class="fish-image" id="Hilmer"></button>
            <div id="modalHilmer" class="modal">
                <div class="modal-content">
                    <span class="closebtn">&times;</span>
                    <h2>Gul Kirugfisk</h2>
                    <p>Den Gule Kirugfisk lever i koralrev</p>
                    <img src="elaal">
                </div>
            </div>
            <button id="Gloriabtn"><img src="img/Gloria.svg" class="fish-image" id="Gloria"></button>
            <div id="modalGloria" class="modal">
                <div class="modal-content">
                    <span class="closebtn">&times;</span>
                    <h2>sild</h2>
                    <p>Sild prutter når de snakker med hinanden</p>
                    <img src="elaal">
                </div>
            </div>
        </section>
    </main>
    
    <script src="js/script.js"></script>
</body>
</html>
