
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billede med popup</title>

    <style>
        /* Billedet, man klikker på */
        .popup-billede {
            width: 300px;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .popup-billede:hover {
            transform: scale(1.03);
        }

        /* Den mørke baggrund over hele skærmen */
        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;

            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Selve tekstboksen */
        .popup-boks {
            position: relative;
            background: #ffffff;
            color: #222222;
            padding: 35px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            animation: popupZoom 0.25s ease;
        }
        .popup-boks img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Luk-knappen */
        .luk-knap {
            position: absolute;
            top: 10px;
            right: 15px;
            border: none;
            background: none;
            font-size: 30px;
            cursor: pointer;
            color: #333333;
        }

        .luk-knap:hover {
            color: #888888;
        }

        /* Lille animation */
        @keyframes popupZoom {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <!-- Billedet, man klikker på -->
    <img
        src="https://placehold.co/600x400"
        alt="Klik på billedet"
        class="popup-billede"
        onclick="aabnPopup()"
    >

    <!-- Popup og mørk baggrund -->
    <div class="popup-overlay" id="popup" onclick="lukPopup()">

        <!-- Tekstboksen -->
        <div class="popup-boks" onclick="event.stopPropagation()">

            <button class="luk-knap"
                    onclick="lukPopup()"
                    aria-label="Luk popup">
                &times;
            </button>

            <h2>Min overskrift</h2>
            
            <p>
                Her kan du skrive den tekst, som skal vises,
                når man klikker på billedet.
            </p>

            <p>
                Du kan også tilføje flere afsnit, links
                og andre HTML-elementer her.
            </p>
            <img src="img/kirurgfiskblaa.jpg" alt="Kirurgfisk" width="300">
        </div>
    </div>

    <script>
        function aabnPopup() {
            document.getElementById("popup").style.display = "flex";
        }

        function lukPopup() {
            document.getElementById("popup").style.display = "none";
        }

        // Luk også popup med Escape-tasten
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                lukPopup();
            }
        });
    </script>

</body>
</html>
